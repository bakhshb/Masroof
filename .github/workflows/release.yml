name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: masroof-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Bump stable version (manual dispatch only)
        id: bump
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/bump-stable-release.sh scripts/gradle-version.sh scripts/next-version-code.sh
          ./scripts/bump-stable-release.sh

      - name: Resolve version and tag
        id: version
        run: |
          chmod +x scripts/gradle-version.sh
          # shellcheck source=scripts/gradle-version.sh
          source scripts/gradle-version.sh
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ steps.bump.outputs.version_name }}"
            VERSION_CODE="${{ steps.bump.outputs.version_code }}"
          else
            VERSION_NAME="$(read_gradle_version_name)"
            VERSION_CODE="$(read_gradle_version_code)"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION_NAME}"
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release target: ${TAG} (${VERSION_NAME}, code ${VERSION_CODE})"

      - name: Skip if release already published
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.skip.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Configure local SDK path
        if: steps.skip.outputs.skip != 'true'
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Decode release keystore
        if: steps.skip.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Create keystore.properties
        if: steps.skip.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Build and publish stable release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/publish-github-release.sh scripts/gradle-version.sh scripts/verify-release-version.sh
          ./scripts/publish-github-release.sh \
            stable \
            "${{ steps.version.outputs.version_name }}" \
            "${{ steps.version.outputs.version_code }}" \
            "${{ steps.version.outputs.tag }}" \
            false

      - name: Commit version bump to main (manual dispatch only)
        if: steps.skip.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${VERSION_NAME}"
          git push
