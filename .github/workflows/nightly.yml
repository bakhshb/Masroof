name: Nightly

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: masroof-publish
  cancel-in-progress: false

jobs:
  nightly:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve nightly version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/next-version-code.sh scripts/next-nightly-version-name.sh scripts/gradle-version.sh
          VERSION_NAME=$(./scripts/next-nightly-version-name.sh)
          VERSION_CODE=$(./scripts/next-version-code.sh)
          TAG="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Nightly target: ${TAG} (code ${VERSION_CODE})"

      - name: Skip if nightly release already published
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.skip.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Configure local SDK path
        if: steps.skip.outputs.skip != 'true'
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Decode release keystore
        if: steps.skip.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Create keystore.properties
        if: steps.skip.outputs.skip != 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Build and publish nightly release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/publish-github-release.sh scripts/gradle-version.sh scripts/verify-release-version.sh
          ./scripts/publish-github-release.sh \
            nightly \
            "${{ steps.version.outputs.version_name }}" \
            "${{ steps.version.outputs.version_code }}" \
            "${{ steps.version.outputs.tag }}" \
            true
